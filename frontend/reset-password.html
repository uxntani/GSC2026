<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <title>Reset Password — Class2.0</title>
  <link rel="stylesheet" href="style.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div class="auth-screen">
    <div class="auth-box glass">
      <div class="auth-form active" style="display:flex">
        <h2 class="auth-title">New Password 🔐</h2>
        <p class="auth-sub">Enter your new password below</p>
      <div style="position: relative;">
        <input type="password" id="newPassword" placeholder="New password (min 6 chars)" class="auth-input"/>
        <i class="fa fa-eye" onclick="togglePassword('newPassword', this)"
        style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;"></i>
      </div>

        <p id="resetError" class="auth-error"></p>
        <button class="auth-btn" onclick="handleReset()">Reset Password</button>
      </div>
    </div>
  </div>
  <script>
    const API = 'http://localhost:3000';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    async function handleReset() {
      const newPassword = document.getElementById('newPassword').value.trim();
      const errEl = document.getElementById('resetError');
      errEl.textContent = '';
      if (!newPassword || newPassword.length < 6) {
        return (errEl.textContent = 'Min 6 characters required.');
      }
      const res = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, newPassword })
      });
      const data = await res.json();
      if (!res.ok) return (errEl.textContent = data.error);
      errEl.style.color = '#6dff7c';
      errEl.textContent = 'Password reset! You can close this tab and log in.';
    }
        function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  }
}

  </script>
</body>
</html>
